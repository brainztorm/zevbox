[package]
name = "zevbox"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Run ACP agents (Claude, Antigravity, and local models through oMLX) for the Zed editor inside Apple Container micro-VMs, behind a filtering ACP relay"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brainztorm/zevbox"
readme = "README.md"
keywords = ["zed", "acp", "sandbox", "apple-container", "agent"]
categories = ["development-tools", "command-line-utilities"]
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "zevbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonc-parser = { version = "0.34", features = ["cst", "serde", "serde_json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
nix = { version = "0.29", features = ["signal", "process", "user"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
